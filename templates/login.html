{% extends "base.html" %}
{% block content %}
<section class="card small">
  <h1>Sign in</h1>
  <form method="post">
    <label>Supervisor ID
      <input type="text" name="code" placeholder="e.g. 2540" required>
    </label>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
  <p class="hint">Only IDs added by Admin can access.</p>
</section>
{% endblock %}
